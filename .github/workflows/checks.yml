name: Daymark checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend and browser dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check the API
        run: python -m unittest discover -s tests -p 'test_api.py' -v
      - name: Check and build the frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test
          npm --prefix frontend run build
      - name: Exercise the production app
        run: |
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/checkout@v6
        with:
          repository: flutter/flutter
          ref: '3.50.1'
          path: .ci/flutter
          persist-credentials: false
      - name: Set up Flutter
        run: echo "$GITHUB_WORKSPACE/.ci/flutter/bin" >> "$GITHUB_PATH"
      - name: Check the Flutter client
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Build an Android debug APK
        run: flutter build apk --debug --target-platform android-arm64 --no-pub
